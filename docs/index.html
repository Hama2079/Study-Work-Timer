<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherFocus - Cloud Sync</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    body { background-color: #05070d; color: #f1f5f9; font-family: system-ui, sans-serif; }
    .neon-border { box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <script>
    // --- 1. INSERT YOUR FIREBASE CONFIG HERE ---
    const FIREBASE_CONFIG = {
      apiKey: "PASTE_YOUR_API_KEY_HERE",
      authDomain: "PASTE_YOUR_AUTH_DOMAIN_HERE",
      databaseURL: "PASTE_YOUR_DATABASE_URL_HERE", // Found on the Realtime Database tab
      projectId: "PASTE_YOUR_PROJECT_ID_HERE",
      storageBucket: "PASTE_YOUR_STORAGE_BUCKET_HERE",
      messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID_HERE",
      appId: "PASTE_YOUR_APP_ID_HERE"
    };

    // Initialize Firebase
    let db = null;
    let isFirebaseReady = false;
    try {
      if (FIREBASE_CONFIG.apiKey !== "PASTE_YOUR_API_KEY_HERE") {
        firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.database();
        isFirebaseReady = true;
      }
    } catch (e) {
      console.error("Firebase init failed:", e);
    }
  </script>

  <!-- App Header -->
  <header class="border-b border-slate-800 bg-[#070b14]/80 backdrop-blur sticky top-0 z-30 px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-cyan-400 font-bold">⚡</div>
        <h1 class="text-lg font-bold tracking-wide">Aether<span class="text-cyan-400">Focus</span></h1>
      </div>

      <!-- Profiles & Cloud Status -->
      <div class="flex items-center gap-2">
        <div id="cloud-pill" class="text-xs px-2.5 py-1 rounded-full border border-slate-700 bg-slate-800/60 text-slate-400 flex items-center gap-1.5">
          <span id="cloud-dot" class="w-2 h-2 rounded-full bg-amber-400"></span>
          <span id="cloud-text">Offline</span>
        </div>

        <div class="flex bg-slate-900 border border-slate-800 rounded-lg p-0.5 text-xs font-semibold">
          <button id="tab-h" onclick="switchProfile('H')" class="px-3 py-1 rounded-md transition bg-cyan-500/20 text-cyan-400">H</button>
          <button id="tab-m" onclick="switchProfile('M')" class="px-3 py-1 rounded-md transition text-slate-400 hover:text-slate-200">M</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto p-4 flex-1 w-full space-y-6">

    <!-- Active Timer Block -->
    <section class="bg-[#0b101d] border border-slate-800/80 rounded-2xl p-6 text-center neon-border">
      <p id="current-subject-label" class="text-xs font-semibold uppercase tracking-wider text-cyan-400">Select a Subject to Study</p>
      <div id="timer-display" class="text-6xl font-mono font-bold tracking-tight my-4">00:00:00</div>
      
      <div class="flex justify-center gap-3">
        <button id="btn-start" onclick="toggleTimer()" class="px-6 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl transition shadow-lg shadow-cyan-500/20">Start</button>
        <button id="btn-stop" onclick="stopTimer()" disabled class="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 font-semibold rounded-xl transition">Stop & Save</button>
      </div>
    </section>

    <!-- Subjects Management -->
    <section class="bg-[#0b101d] border border-slate-800/80 rounded-2xl p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="font-bold text-sm text-slate-300">Study Subjects (<span id="profile-indicator">Profile H</span>)</h2>
        <button onclick="promptNewSubject()" class="text-xs bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 text-cyan-400 px-3 py-1.5 rounded-lg transition font-medium">+ Add Subject</button>
      </div>

      <div id="subjects-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <!-- Injected dynamically -->
      </div>
    </section>

    <!-- Daily Breakdown -->
    <section class="bg-[#0b101d] border border-slate-800/80 rounded-2xl p-5">
      <h2 class="font-bold text-sm text-slate-300 mb-3">Today's Total Time</h2>
      <div id="total-today" class="text-2xl font-bold font-mono text-cyan-400">0.0 hrs</div>
    </section>
  </main>

  <script>
    let activeProfile = 'H';
    let appData = {
      H: { subjects: ['Electronics', 'Embedded Systems'], logs: [] },
      M: { subjects: ['General Study'], logs: [] }
    };

    let activeSubject = null;
    let timerRunning = false;
    let startTimestamp = null;
    let timerInterval = null;

    // Load from LocalStorage first for instant rendering
    const local = localStorage.getItem('aether_data');
    if (local) {
      try { appData = JSON.parse(local); } catch (e) {}
    }

    // Connect to Firebase Realtime Sync
    if (isFirebaseReady) {
      const dataRef = db.ref('study_app_data');
      
      // Listen for remote updates from Phone or Laptop
      dataRef.on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          appData = val;
          localStorage.setItem('aether_data', JSON.stringify(appData));
          renderUI();
        }
        document.getElementById('cloud-dot').className = "w-2 h-2 rounded-full bg-emerald-400";
        document.getElementById('cloud-text').innerText = "Live Synced";
      });
    }

    function saveState() {
      localStorage.setItem('aether_data', JSON.stringify(appData));
      if (isFirebaseReady) {
        db.ref('study_app_data').set(appData);
      }
      renderUI();
    }

    function switchProfile(p) {
      activeProfile = p;
      document.getElementById('tab-h').className = p === 'H' 
        ? "px-3 py-1 rounded-md transition bg-cyan-500/20 text-cyan-400" 
        : "px-3 py-1 rounded-md transition text-slate-400 hover:text-slate-200";
      document.getElementById('tab-m').className = p === 'M' 
        ? "px-3 py-1 rounded-md transition bg-cyan-500/20 text-cyan-400" 
        : "px-3 py-1 rounded-md transition text-slate-400 hover:text-slate-200";
      document.getElementById('profile-indicator').innerText = `Profile ${p}`;
      renderUI();
    }

    function promptNewSubject() {
      const name = prompt("Enter new subject name:");
      if (!name) return;
      appData[activeProfile].subjects.push(name.trim());
      saveState();
    }

    function selectSubject(name) {
      if (timerRunning) return;
      activeSubject = name;
      document.getElementById('current-subject-label').innerText = `Active Subject: ${name}`;
      renderUI();
    }

    // Timestamp-delta timing engine (works when phone sleeps)
    function toggleTimer() {
      if (!activeSubject) {
        alert("Please select a subject below first.");
        return;
      }
      if (!timerRunning) {
        timerRunning = true;
        startTimestamp = Date.now();
        document.getElementById('btn-start').innerText = "Pause";
        document.getElementById('btn-stop').disabled = false;
        timerInterval = setInterval(updateClock, 200);
      } else {
        timerRunning = false;
        clearInterval(timerInterval);
        document.getElementById('btn-start').innerText = "Resume";
      }
    }

    function updateClock() {
      if (!timerRunning) return;
      const elapsedSec = Math.floor((Date.now() - startTimestamp) / 1000);
      const hrs = String(Math.floor(elapsedSec / 3600)).padStart(2, '0');
      const mins = String(Math.floor((elapsedSec % 3600) / 60)).padStart(2, '0');
      const secs = String(elapsedSec % 60).padStart(2, '0');
      document.getElementById('timer-display').innerText = `${hrs}:${mins}:${secs}`;
    }

    function stopTimer() {
      if (!startTimestamp) return;
      const elapsedSec = Math.floor((Date.now() - startTimestamp) / 1000);
      clearInterval(timerInterval);
      timerRunning = false;
      document.getElementById('btn-start').innerText = "Start";
      document.getElementById('btn-stop').disabled = true;
      document.getElementById('timer-display').innerText = "00:00:00";

      if (elapsedSec > 5) {
        appData[activeProfile].logs.push({
          subject: activeSubject,
          seconds: elapsedSec,
          timestamp: Date.now()
        });
        saveState();
      }
      startTimestamp = null;
    }

    function renderUI() {
      const list = document.getElementById('subjects-list');
      list.innerHTML = '';
      const subjects = appData[activeProfile].subjects || [];

      subjects.forEach(sub => {
        const div = document.createElement('div');
        div.className = `p-3 rounded-xl border flex justify-between items-center cursor-pointer transition ${activeSubject === sub ? 'border-cyan-500 bg-cyan-500/10' : 'border-slate-800 bg-slate-900/50 hover:border-slate-700'}`;
        div.onclick = () => selectSubject(sub);
        div.innerHTML = `
          <span class="font-medium text-sm text-slate-200">${sub}</span>
          <span class="text-xs text-cyan-400 font-semibold">${activeSubject === sub ? 'Selected' : 'Tap to focus'}</span>
        `;
        list.appendChild(div);
      });

      // Calculate today's study hours
      const todayStart = new Date().setHours(0,0,0,0);
      const totalSec = (appData[activeProfile].logs || [])
        .filter(l => l.timestamp >= todayStart)
        .reduce((sum, item) => sum + item.seconds, 0);
      document.getElementById('total-today').innerText = `${(totalSec / 3600).toFixed(2)} hrs`;
    }

    renderUI();
  </script>
</body>
</html>
